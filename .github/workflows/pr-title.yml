name: PR title

# Squash merges turn the PR title into the commit on main, and release-please reads that commit
# to pick the next version and write the changelog. So the title must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
