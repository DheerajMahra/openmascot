<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>How a move places the mascot on the x-y plane</title>
  <desc>The mascot rests centered on the floor inside its own grid-sized box. Positive y hops up, negative x and positive x slide it left and right, and negative y sinks it so the rows below the floor are cut off. The box never grows; moves draw outside it.</desc>
  <defs>
    <clipPath id="above-floor"><rect x="0" y="0" width="760" height="330"/></clipPath>
    <clipPath id="below-floor"><rect x="0" y="330" width="760" height="170"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="mascot">
      <rect x="332" y="246" width="96" height="60" rx="8"/>
      <rect x="350" y="306" width="10" height="24"/>
      <rect x="400" y="306" width="10" height="24"/>
    </g>
    <g id="eyes" fill="#04342c">
      <rect x="360" y="266" width="8" height="10"/>
      <rect x="392" y="266" width="8" height="10"/>
    </g>
  </defs>

  <rect width="760" height="500" fill="#fbfaf7"/>

  <!-- Axes -->
  <path d="M380 40V90M380 186V208M380 232V246M380 306V330" stroke="#b4b2a9" stroke-width="1" fill="none"/>
  <line x1="380" y1="330" x2="380" y2="430" stroke="#b4b2a9" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="390" y="50" fill="#2c2c2a" font-weight="600">+y  up</text>
  <text x="390" y="446" fill="#2c2c2a" font-weight="600">−y  sinks: cut off at the floor</text>
  <text x="44" y="320" fill="#2c2c2a" font-weight="600">−x  left</text>
  <text x="716" y="320" fill="#2c2c2a" font-weight="600" text-anchor="end">+x  right</text>

  <!-- Hop: y = +n -->
  <g transform="translate(0 -150)" fill="#1d9e75" opacity="0.35"><use href="#mascot"/></g>
  <text x="444" y="132" fill="#3d3d3a">y = +n: hops up</text>

  <!-- Slide left: x = -n -->
  <g transform="translate(-200 0)" fill="#1d9e75" opacity="0.35"><use href="#mascot"/></g>
  <text x="180" y="228" fill="#3d3d3a" text-anchor="middle">x = −n: slides left</text>
  <line x1="302" y1="276" x2="238" y2="276" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Slide right and sink: x = +n, y = -2 -->
  <g transform="translate(200 40)" fill="#1d9e75" opacity="0.35" clip-path="url(#above-floor)"><use href="#mascot"/></g>
  <g clip-path="url(#below-floor)">
    <g transform="translate(200 40)" fill="#fbe3e3" stroke="#a32d2d" stroke-width="1" stroke-dasharray="3 3"><use href="#mascot"/></g>
  </g>
  <text x="580" y="228" fill="#3d3d3a" text-anchor="middle">x = +n, y = −2: slides right</text>
  <text x="580" y="246" fill="#3d3d3a" text-anchor="middle">and sinks 2 rows</text>
  <line x1="458" y1="276" x2="522" y2="276" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="394" fill="#a32d2d" text-anchor="middle">cut off: never drawn</text>

  <!-- Resting mascot inside its box -->
  <rect x="308" y="234" width="144" height="96" fill="none" stroke="#534ab7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#1d9e75"><use href="#mascot"/></g>
  <use href="#eyes"/>
  <text x="380" y="224" fill="#3c3489" text-anchor="middle">rest: x = 0, y = 0</text>

  <!-- Floor -->
  <line x1="40" y1="330" x2="720" y2="330" stroke="#2c2c2a" stroke-width="2"/>
  <text x="44" y="352" fill="#5f5e5a">floor = bottom edge of the mascot's box</text>

  <!-- Legend -->
  <line x1="40" y1="466" x2="720" y2="466" stroke="#e3dcd2"/>
  <rect x="40" y="478" width="18" height="12" fill="none" stroke="#534ab7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="64" y="489" fill="#3d3d3a">the mascot's box on the page: always the grid size, never grows</text>
  <rect x="470" y="478" width="18" height="12" fill="#1d9e75" opacity="0.35"/>
  <text x="494" y="489" fill="#3d3d3a">during a move</text>
  <rect x="600" y="478" width="18" height="12" fill="#fbe3e3" stroke="#a32d2d" stroke-dasharray="3 3"/>
  <text x="624" y="489" fill="#3d3d3a">cut off</text>
</svg>
